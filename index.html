<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Semakan Kedudukan Kelas</title>

  <style>
    :root{
      --primary:#ffc4d6;
      --secondary:#ffe4d4;
      --bg1:#fff7cc;
      --bg2:#fff1b8;
      --text:#2d2d2d;
      --muted:#666;
      --border:#eee;
      --dangerBg:#ffe5e5;
      --dangerText:#b30000;
      --okBg:#e9fff4;
      --okText:#0f7a4a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Segoe UI, system-ui, -apple-system, Arial, sans-serif;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px;
      color:var(--text);
    }
    .container{max-width:560px;width:100%}
    .screen{display:none}
    .screen.active{display:block}
    .header{text-align:center;margin-bottom:18px;}
    .badge{
      display:inline-block;padding:8px 12px;border-radius:999px;
      font-weight:900;font-size:.85rem;background:rgba(255,196,214,.35);
      margin:0 auto 10px;
    }
    .logo{
      background:#fff;width:120px;height:120px;margin:0 auto 16px;
      border-radius:22px;display:flex;align-items:center;justify-content:center;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }
    .logo img{width:92px;height:auto;display:block}
    .title{text-align:center;font-weight:900;margin:0}
    .subtitle{text-align:center;color:var(--muted);margin:8px 0 0;line-height:1.35}
    .grid{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
    .pill{
      width:100%;border:none;border-radius:999px;padding:16px 18px;font-weight:900;
      cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--secondary));
      color:var(--text);box-shadow:0 10px 22px rgba(255,196,214,.35);
      transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .pill:hover{transform:scale(1.03);box-shadow:0 14px 30px rgba(255,196,214,.55);filter:saturate(1.03)}
    .pill:active{transform:scale(.98)}
    .pill.secondary{
      background:#f1f1f1;box-shadow:0 10px 22px rgba(0,0,0,.10);
    }
    .pill.secondary:hover{box-shadow:0 14px 30px rgba(0,0,0,.14)}
    .input-wrap{
      background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.08);
